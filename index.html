<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090912">
<title>Mighty Action X - Super Prototype</title>
<style>
:root{
  --pink:#ff3fa4;--lime:#b8ff38;--cyan:#35e7ff;--yellow:#ffe65a;
  --orange:#ff762f;--red:#ff315e;--blue:#23d8ff;--gold:#ffd72f;
  --panel:#17152c;--ink:#080812;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080812;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
button{font:inherit;color:#fff;border:0;cursor:pointer;user-select:none}
.screen{display:none;position:absolute;inset:0;overflow:auto;background:radial-gradient(circle at 50% 8%,#42306f,#17102b 56%,#080812)}
.screen.on{display:flex}
#title{background:#000;overflow:hidden;align-items:center;justify-content:center}
#title img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;user-select:none;-webkit-user-drag:none}
#titleStart{position:absolute;inset:0;width:100%;height:100%;background:transparent;opacity:0;z-index:3}
.menu{margin:auto;padding:24px;width:min(1020px,100%)}
.topline{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(25px,5vw,39px);font-style:italic;letter-spacing:.035em;text-shadow:0 3px 0 #000}
.back,.smallBtn{padding:10px 14px;border-radius:12px;background:#3d3b60;border:1px solid #ffffff22;font-weight:800}
.smallBtn{font-size:12px;padding:8px 11px}
.debugRow{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.card{position:relative;min-height:174px;padding:17px;border-radius:22px;text-align:left;background:linear-gradient(145deg,#302a52,#19172e);border:2px solid #5d5683;box-shadow:0 7px 0 #090812;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff12,transparent 34%);pointer-events:none}
.card:hover{transform:translateY(-2px)}
.card strong{display:block;font-size:19px;margin:7px 0;position:relative}.card small{opacity:.78;line-height:1.5;position:relative}
.card.lock{opacity:.42;filter:grayscale(1)}.card.sel{border-color:var(--lime);box-shadow:0 0 0 3px #b8ff3830,0 7px #090812}
.icon{font-size:40px;position:relative}.tag{position:absolute;right:10px;top:10px;padding:5px 8px;border-radius:9px;background:#080812;font-size:11px;font-weight:900;z-index:1}
.big{padding:15px 29px;border-radius:17px;background:linear-gradient(135deg,var(--pink),#754cff);box-shadow:0 6px 0 #4c1b65;font-weight:1000;font-size:20px}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #4c1b65}
.help{margin-top:20px;padding:14px 16px;border:1px solid #ffffff20;border-radius:15px;background:#09081280;font-size:13px;line-height:1.75;color:#ddd}
#game{overflow:hidden;background:#111;touch-action:none}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:7px;pointer-events:none;align-items:flex-start}
.hbox{padding:7px 10px;border-radius:11px;background:#080912df;border:1px solid #ffffff2d;font-size:12px;font-weight:900;backdrop-filter:blur(4px);text-shadow:0 2px #000}
#hpBox{width:min(37vw,270px)}
.bar{height:11px;background:#48182e;border-radius:8px;overflow:hidden;margin-top:4px;position:relative}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff3e79,#ffe65a)}
#gauge{height:100%;width:100%;background:linear-gradient(90deg,#35e7ff,#b8ff38,#ffe65a)}
#gaugeBox{width:min(24vw,190px)}
#formHud{margin-left:auto;max-width:180px}
#weaponHud{min-width:85px;text-align:center}
#comboHud{position:absolute;left:50%;top:68px;transform:translateX(-50%);font-size:clamp(21px,5vw,38px);font-weight:1000;font-style:italic;color:#fff;text-shadow:0 3px 0 #000,0 0 12px #ff3fa4;opacity:0;transition:.12s;pointer-events:none}
#comboHud.on{opacity:1}
#controls{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.movePad,.attackPad{pointer-events:auto}
.movePad{display:flex;gap:6px;align-items:flex-end}
.attackPad{display:grid;grid-template-columns:repeat(3,54px);gap:5px;align-items:end}
.ctl{width:58px;height:58px;border-radius:19px;background:#202743eb;border:2px solid #ffffff35;box-shadow:0 4px 0 #05060c;font-weight:1000;font-size:20px;touch-action:none;text-shadow:0 2px #000}
.ctl.act{width:54px;height:50px;border-radius:16px;font-size:9px;line-height:1.05;padding:2px}
.ctl.finish{background:linear-gradient(145deg,#b5297c,#6d2de2);font-size:9px}
.ctl.gashat{background:linear-gradient(145deg,#178c79,#2846a8);font-size:8px}
.ctl.on{transform:translateY(3px);box-shadow:0 1px 0 #05060c;background:#4a587e}
.ctl.disabled{opacity:.36;filter:grayscale(1)}
#toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:15px;background:#080912ef;border:2px solid var(--yellow);font-weight:1000;text-align:center;opacity:0;transition:.15s;max-width:90vw;pointer-events:none;z-index:6;text-shadow:0 2px #000}
#toast.on{opacity:1}
#menuBtn{position:absolute;right:9px;top:60px;padding:8px 11px;border-radius:11px;background:#171a2ce5;border:1px solid #ffffff2d;z-index:5}
#overlay{display:none;position:absolute;inset:0;z-index:20;background:#070812e9;align-items:center;justify-content:center;padding:18px}
#overlay.on{display:flex}
.dialog{width:min(590px,96vw);padding:23px;border-radius:22px;background:#24213d;border:2px solid #625d86;text-align:center;box-shadow:0 16px 60px #000}
.dialog h2{margin:0 0 10px;font-size:29px}.dialog p{line-height:1.65}.dialog button{padding:12px 18px;border-radius:12px;background:linear-gradient(135deg,var(--pink),#7950ff);font-weight:900;margin:5px}
.kbd{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;opacity:.48;pointer-events:none;white-space:nowrap}
#bossHud{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:min(55vw,520px);padding:8px 11px;border-radius:13px;background:#080912e8;border:1px solid #ffffff30;display:none;pointer-events:none;text-align:center;font-size:12px;font-weight:1000}
#bossHud.on{display:block}.bossbar{height:12px;background:#30131f;border-radius:8px;overflow:hidden;margin-top:4px}.bossfill{height:100%;background:linear-gradient(90deg,#ff3e79,#ff8c32,#ffe65a)}
@media(pointer:coarse){.kbd{display:none}}
@media(max-width:680px){#stageHud{display:none}#gaugeBox{width:29vw}.attackPad{grid-template-columns:repeat(3,48px)}.ctl.act{width:48px;height:46px}.ctl{width:52px;height:52px}.movePad{gap:4px}.attackPad{gap:4px}}
@media(max-width:410px){#hpBox{width:36vw}.hbox{font-size:10px;padding:6px 7px}.attackPad{grid-template-columns:repeat(3,44px)}.ctl.act{width:44px;height:43px;font-size:8px}.ctl{width:48px;height:48px}.movePad{gap:3px}.attackPad{gap:3px}}
</style>
</head>

<section id="title" class="screen on"><img src="title.png" alt="Mighty Action X GAME START"><button id="titleStart" aria-label="GAME START"></button></section>

let selectedStage=1,selectedForm='Mighty';
function renderStages(){const box=$('#stageCards');box.innerHTML='';STAGES.forEach(s=>{const open=save.stages.includes(s.id),b=document.createElement('button');b.className='card'+(open?'':' lock');b.innerHTML=`<span class="tag">${open?'OPEN':'🔒 LOCK'}</span><div class="icon">${s.icon}</div><strong>STAGE ${s.id}<br>${s.name}</strong><small>${open?s.desc:'前のステージをクリアすると解放'}</small>`;b.onclick=()=>{if(!open)return;selectedStage=s.id;renderForms();show('forms')};box.appendChild(b)})}
function renderForms(){const box=$('#formCards');box.innerHTML='';FORM_ORDER.forEach(id=>{const f=FORM_DEFS[id],open=save.forms.includes(id),b=document.createElement('button');b.className='card'+(open?'':' lock')+(open&&selectedForm===id?' sel':'');b.innerHTML=`<span class="tag">${open?'SELECT':'🔒 LOCK'}</span><div class="icon">${f.icon}</div><strong>${f.name}</strong><small>${open?f.desc:'ゲームを進めると解放'}</small>`;b.onclick=()=>{if(open){selectedForm=id;renderForms()}};box.appendChild(b)})}

function drawHydra(e){enemyTransform(e);const s=e.w/100;ctx.scale(s,s);ctx.strokeStyle='#24143a';ctx.lineWidth=4;ctx.fillStyle='#4b2c72';rr(18,40,64,60,16);ctx.fill();ctx.stroke();const cols=['#a653ff','#55ffc9','#ff5ca8'];for(let i=0;i<3;i++){const x=25+i*25,y=25-(i%2)*10;ctx.strokeStyle='#332047';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(50,52);ctx.lineTo(x,y+10);ctx.stroke();ctx.fillStyle=cols[i];ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#b8ff38';ctx.beginPath();ctx.moveTo(33,55);ctx.lineTo(68,55);ctx.lineTo(78,78);ctx.lineTo(50,92);ctx.lineTo(22,78);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawStarBoss(e){enemyTransform(e);const s=e.w/88;ctx.scale(s,s);ctx.strokeStyle='#5a2a19';ctx.lineWidth=4;ctx.fillStyle='#ffd52a';ctx.beginPath();ctx.moveTo(43,-2);ctx.lineTo(52,15);ctx.lineTo(70,3);ctx.lineTo(66,23);ctx.lineTo(86,18);ctx.lineTo(72,36);ctx.lineTo(84,51);ctx.lineTo(61,49);ctx.lineTo(48,69);ctx.lineTo(36,50);ctx.lineTo(13,55);ctx.lineTo(25,34);ctx.lineTo(6,22);ctx.lineTo(28,20);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#f4ecdf';ctx.beginPath();ctx.moveTo(17,27);ctx.lineTo(68,23);ctx.lineTo(75,44);ctx.lineTo(56,58);ctx.lineTo(26,55);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#12131f';ctx.beginPath();ctx.moveTo(22,31);ctx.lineTo(67,28);ctx.lineTo(69,43);ctx.lineTo(53,52);ctx.lineTo(28,49);ctx.closePath();ctx.fill();ctx.fillStyle='#ff4cb4';ctx.fillRect(29,34,10,8);ctx.fillRect(53,33,10,8);ctx.fillStyle='#ffd52a';rr(20,58,49,39,13);ctx.fill();ctx.stroke();ctx.fillStyle='#ff4cb4';for(let i=0;i<3;i++){const x=18+i*27,y=75;ctx.beginPath();for(let n=0;n<10;n++){const a=-Math.PI/2+n*Math.PI/5,r=n%2?4:9;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore()}
function drawChronos(e){enemyTransform(e);const s=e.w/88;ctx.scale(s,s);ctx.strokeStyle='#0d1912';ctx.lineWidth=4;ctx.fillStyle='#11171a';rr(18,36,54,66,12);ctx.fill();ctx.stroke();ctx.fillStyle='#3da84f';ctx.beginPath();ctx.moveTo(10,12);ctx.lineTo(26,2);ctx.lineTo(38,15);ctx.lineTo(46,-2);ctx.lineTo(55,15);ctx.lineTo(74,5);ctx.lineTo(70,34);ctx.lineTo(14,34);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#d9e5d8';ctx.beginPath();ctx.moveTo(18,17);ctx.lineTo(65,14);ctx.lineTo(70,27);ctx.lineTo(55,35);ctx.lineTo(29,33);ctx.closePath();ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.moveTo(23,20);ctx.lineTo(40,18);ctx.lineTo(37,28);ctx.lineTo(25,29);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(46,18);ctx.lineTo(63,17);ctx.lineTo(62,28);ctx.lineTo(49,29);ctx.closePath();ctx.fill();ctx.fillStyle='#b8ff38';ctx.fillRect(29,22,7,5);ctx.fillRect(52,21,7,5);
 ctx.fillStyle='#1a2020';ctx.fillRect(20,39,50,54);ctx.fillStyle='#3da84f';ctx.beginPath();ctx.moveTo(11,42);ctx.lineTo(26,34);ctx.lineTo(31,54);ctx.lineTo(16,63);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(75,41);ctx.lineTo(62,34);ctx.lineTo(57,54);ctx.lineTo(72,64);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.strokeStyle='#b8ff38';ctx.lineWidth=5;ctx.beginPath();ctx.arc(45,54,12,0,Math.PI*2);ctx.stroke();ctx.lineWidth=2;for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(45+Math.cos(a)*7,54+Math.sin(a)*7);ctx.lineTo(45+Math.cos(a)*11,54+Math.sin(a)*11);ctx.stroke()}ctx.fillStyle='#3da84f';ctx.beginPath();ctx.moveTo(22,90);ctx.lineTo(37,90);ctx.lineTo(31,111);ctx.lineTo(15,111);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(52,90);ctx.lineTo(68,90);ctx.lineTo(74,111);ctx.lineTo(57,111);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawEnemy(e){if(e.x-CAM+e.w<-100||e.x-CAM>W+100)return;if(e.type==='orange')drawOrange(e);else if(e.type==='white')drawWhite(e);else if(e.type==='drone')drawDrone(e);else if(e.type==='shield')drawShield(e);else if(e.type==='blaster')drawBlaster(e);else if(e.type==='crusher')drawCrusher(e);else if(e.type==='gear')drawGear(e);else if(e.type==='paradox')drawParadox(e);else if(e.type==='hydra')drawHydra(e);else if(e.type==='star')drawStarBoss(e);else if(e.type==='chronos')drawChronos(e)}
function drawProjectile(p){const x=p.x-CAM,y=p.y;ctx.save();ctx.translate(x+p.w/2,y+p.h/2);ctx.rotate(p.spin);ctx.shadowColor=p.color;ctx.shadowBlur=14;ctx.fillStyle=p.color;ctx.strokeStyle='#fff';ctx.lineWidth=2;if(p.type==='spear'){ctx.fillRect(-p.w/2,-3,p.w*1.7,6);ctx.beginPath();ctx.moveTo(p.w,-9);ctx.lineTo(p.w+12,0);ctx.lineTo(p.w,9);ctx.closePath();ctx.fill();ctx.stroke()}else if(p.type==='wave'){ctx.strokeStyle=p.color;ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,p.w,-1.1,1.1);ctx.stroke()}else if(p.type==='star'){ctx.beginPath();for(let n=0;n<10;n++){const a=-Math.PI/2+n*Math.PI/5,r=n%2?p.w*.22:p.w*.58;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}else if(p.type==='clock'){ctx.beginPath();ctx.arc(0,0,p.w*.55,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle='#17351f';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-p.w*.38);ctx.moveTo(0,0);ctx.lineTo(p.w*.28,p.w*.18);ctx.stroke()}else{ctx.beginPath();ctx.arc(0,0,p.w*.55,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.restore()}
function drawEffects(){for(const e of effects){const k=1-e.life/e.max,x=e.x-CAM,y=e.y;ctx.save();ctx.globalAlpha=Math.max(0,e.life/e.max);ctx.translate(x,y);ctx.globalCompositeOperation='lighter';if(e.type==='guard'){ctx.strokeStyle=e.color;ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,e.r*(.6+k),0,Math.PI*2);ctx.stroke()}else if(e.type==='dash'){ctx.fillStyle=e.color;ctx.globalAlpha*=.3;ctx.beginPath();ctx.moveTo(0,-e.r/2);ctx.lineTo(-e.face*e.r*1.7,0);ctx.lineTo(0,e.r/2);ctx.closePath();ctx.fill()}else if(e.type==='hammer'){ctx.strokeStyle=e.color;ctx.lineWidth=12;ctx.beginPath();ctx.arc(0,0,e.r*(.7+k),-1.5,.4);ctx.stroke()}else if(e.type==='sword'){ctx.strokeStyle=e.color;ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,0,e.r*(.8+k),-1.0,.9);ctx.stroke()}else if(e.type==='finisher'){for(let i=0;i<3;i++){ctx.strokeStyle=i===0?'#ffe65a':i===1?'#ff3fa4':'#35e7ff';ctx.lineWidth=14-i*4;ctx.beginPath();ctx.arc(0,0,e.r*(.35+k)+i*18,0,Math.PI*2);ctx.stroke()}}else{ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,e.r*(.25+k),0,Math.PI*2);ctx.fill()}ctx.restore()}}
function drawParticlesAndText(){for(const p of particles){const x=p.x-CAM,y=p.y;ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floatTexts){const x=f.x-CAM,y=f.y;ctx.globalAlpha=Math.min(1,f.life*2);ctx.font=`1000 ${f.size}px system-ui`;ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#111';ctx.strokeText(f.text,x,y);ctx.fillStyle=f.color;ctx.fillText(f.text,x,y)}ctx.globalAlpha=1}
function drawWorld(){drawBackground();drawPlatforms();drawGoal();for(const p of projectiles)drawProjectile(p);for(const e of enemies)drawEnemy(e);drawPlayer();drawEffects();drawParticlesAndText()}
function drawScreenFx(){if(timeStopFx>0){ctx.save();ctx.globalAlpha=Math.min(.30,timeStopFx*.28);ctx.fillStyle='#65ff7a';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#b8ff38';ctx.lineWidth=8;ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*.34,0,Math.PI*2);ctx.stroke();ctx.font=`1000 ${Math.min(76,W*.14)}px system-ui`;ctx.textAlign='center';ctx.strokeStyle='#07120a';ctx.lineWidth=8;ctx.strokeText('PAUSE',W/2,H*.43);ctx.fillStyle='#b8ff38';ctx.fillText('PAUSE',W/2,H*.43);ctx.restore()}
 if(transformFx>0){const k=transformFx/.72;ctx.save();ctx.globalAlpha=Math.min(1,k*1.8);const color=FORM_DEFS[player.form].colors[0];const rg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);rg.addColorStop(0,color+'aa');rg.addColorStop(.35,'#ffffff22');rg.addColorStop(1,'#00000000');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.font=`1000 ${Math.min(48,W*.09)}px system-ui`;ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#111';ctx.strokeText(FORM_DEFS[player.form].name,W/2,H*.30);ctx.fillStyle='#fff';ctx.fillText(FORM_DEFS[player.form].name,W/2,H*.30);ctx.restore()}
 if(player.attack&&player.attack.type==='finisher'){const t=player.attack.t;ctx.save();const pulse=Math.sin(Math.min(1,t/1.5)*Math.PI);ctx.globalAlpha=.18*pulse;ctx.fillStyle=t<.55?'#ff3fa4':'#ffe65a';ctx.fillRect(0,0,W,H);ctx.globalAlpha=Math.min(1,pulse*1.5);ctx.font=`1000 italic ${Math.min(56,W*.105)}px system-ui`;ctx.textAlign='center';ctx.lineWidth=10;ctx.strokeStyle='#111';ctx.strokeText('MIGHTY CRITICAL STRIKE!',W/2,H*.23);ctx.fillStyle='#ffe65a';ctx.fillText('MIGHTY CRITICAL STRIKE!',W/2,H*.23);ctx.restore()}
 if(screenFlash>0){ctx.globalAlpha=Math.min(.75,screenFlash*2.3);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(screenShake>0){ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake)}drawWorld();ctx.restore();drawScreenFx()}
