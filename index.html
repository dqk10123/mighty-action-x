<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mighty Action X - Fan Prototype</title>
<style>
:root{--pink:#ff3fa4;--lime:#b8ff38;--cyan:#35e7ff;--yellow:#ffe65a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080812;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button{font:inherit;color:#fff;border:0;cursor:pointer;user-select:none}
.screen{display:none;position:absolute;inset:0;overflow:auto;background:radial-gradient(circle at 50% 8%,#42306f,#17102b 56%,#080812)}.screen.on{display:flex}
#title{background:#000;overflow:hidden;align-items:center;justify-content:center}#title img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;user-select:none;-webkit-user-drag:none}#titleStart{position:absolute;inset:0;width:100%;height:100%;background:transparent;opacity:0;z-index:3}
.menu{margin:auto;padding:24px;width:min(900px,100%)}.top{display:flex;align-items:center;gap:12px;margin-bottom:15px}h1{margin:0;font-size:clamp(25px,5vw,38px);font-style:italic}.back{padding:10px 14px;border-radius:12px;background:#3d3b60}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px}.card{position:relative;min-height:160px;padding:17px;border-radius:21px;text-align:left;background:linear-gradient(145deg,#302a52,#19172e);border:2px solid #5d5683;box-shadow:0 6px #090812}.card strong{display:block;font-size:19px;margin:7px 0}.card small{opacity:.75;line-height:1.5}.card.lock{opacity:.42;filter:grayscale(1)}.card.sel{border-color:var(--lime);box-shadow:0 0 0 3px #b8ff3830,0 6px #090812}.icon{font-size:38px}.tag{position:absolute;right:10px;top:10px;padding:5px 8px;border-radius:9px;background:#080812;font-size:11px;font-weight:900}
.big{padding:15px 28px;border-radius:17px;background:linear-gradient(135deg,var(--pink),#754cff);box-shadow:0 6px #4c1b65;font-weight:1000;font-size:20px}.help{margin-top:20px;padding:13px;border:1px solid #ffffff20;border-radius:15px;background:#09081280;font-size:13px;line-height:1.7}
#game{overflow:hidden;background:#111;touch-action:none}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:7px;pointer-events:none}.hbox{padding:7px 10px;border-radius:11px;background:#080912df;border:1px solid #ffffff2d;font-size:12px;font-weight:900}.hpbox{width:min(42vw,270px)}.bar{height:11px;background:#48182e;border-radius:8px;overflow:hidden;margin-top:4px}#hp{height:100%;background:linear-gradient(90deg,#ff3e79,#ffe65a)}#formHud{margin-left:auto}
#controls{position:absolute;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}.grp{display:flex;gap:6px;pointer-events:auto;align-items:flex-end}.ctl{width:58px;height:58px;border-radius:19px;background:#202743e9;border:2px solid #ffffff35;box-shadow:0 4px #05060c;font-weight:1000;font-size:20px;touch-action:none}.ctl.a{width:54px;height:54px;font-size:10px}.ctl.sp{width:68px;height:68px;background:#b5297ce9;font-size:11px}.ctl.on{transform:translateY(3px);background:#4a587e}
#toast{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:15px;background:#080912ef;border:2px solid var(--yellow);font-weight:1000;text-align:center;opacity:0;transition:.15s;pointer-events:none}#toast.on{opacity:1}#menuBtn{position:absolute;right:9px;top:58px;padding:8px 11px;border-radius:11px;background:#171a2ce5}
#overlay{display:none;position:absolute;inset:0;z-index:9;background:#070812e9;align-items:center;justify-content:center;padding:18px}#overlay.on{display:flex}.dlg{width:min(560px,96vw);padding:22px;border-radius:22px;background:#24213d;border:2px solid #625d86;text-align:center}.dlg button{padding:12px 18px;border-radius:12px;background:linear-gradient(135deg,var(--pink),#7950ff);font-weight:900}.kbd{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;opacity:.45;pointer-events:none}
@media(pointer:coarse){.kbd{display:none}}@media(max-width:500px){.ctl{width:52px;height:52px}.ctl.a{width:48px;height:48px}.ctl.sp{width:61px;height:61px}.grp{gap:4px}}
</style></head><body>
<section id="title" class="screen on"><img src="title.png" alt="Mighty Action X GAME START"><button id="titleStart" aria-label="GAME START"></button></section>
<section id="stages" class="screen"><div class="menu"><div class="top"><button class="back" data-go="title">← TITLE</button><h1>STAGE SELECT</h1></div><div id="stageCards" class="cards"></div><div class="help">クリアすると次のステージが解放されます。進行状況はこのブラウザに保存されます。</div></div></section>
<section id="forms" class="screen"><div class="menu"><div class="top"><button class="back" data-go="stages">← STAGE</button><h1>PLAYER SELECT</h1></div><div id="formCards" class="cards"></div><p style="text-align:center;margin-top:22px"><button id="play" class="big">GAME START!</button></p></div></section>
<section id="game" class="screen"><canvas id="c"></canvas><div id="hud"><div class="hbox hpbox">MIGHTY HP<div class="bar"><div id="hp"></div></div></div><div id="stageHud" class="hbox"></div><div id="formHud" class="hbox"></div></div><button id="menuBtn">MENU</button><div id="toast"></div><div id="controls"><div class="grp"><button class="ctl" data-k="l">←</button><button class="ctl" data-k="r">→</button><button class="ctl" data-k="j">↑</button></div><div class="grp"><button class="ctl a" data-k="p">PUNCH</button><button class="ctl a" data-k="k">KICK</button><button class="ctl sp" data-k="s">必殺</button></div></div><div class="kbd">PC: ← → 移動 / SPACE ジャンプ / Z パンチ / X キック / C 必殺</div><div id="overlay"></div></section>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];function show(id){$$('.screen').forEach(x=>x.classList.toggle('on',x.id===id))}$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
let save;try{save=JSON.parse(localStorage.getItem('mightyFinal')||'{}')}catch(e){save={}}save.stages=save.stages||[1];save.forms=save.forms||['Mighty'];const persist=()=>localStorage.setItem('mightyFinal',JSON.stringify(save));
const ST=[['MIGHTY CITY','街を駆け抜け、エナジーを集めてボスを倒せ！','🏙️'],['PARADOX AREA','パラドクスが登場。新しい力を手に入れろ！','🧩'],['CHRONOS ZONE','クロノスとの決戦。強力な攻撃をかわして進め！','⌛']];
const FM=[['Mighty','MIGHTY','基本キャラクター。スピードと攻撃のバランス型。','🎮'],['BrothersXX','MIGHTY BROTHERS XX','パラドクスイベントで解放。攻撃力アップ。','✌️'],['HyperMuteki','HYPER MUTEKI','クロノス撃破で解放。高火力＋ダメージ軽減。','⭐']];
let stage=1,form='Mighty';
function renderStages(){let z=$('#stageCards');z.innerHTML='';ST.forEach((a,i)=>{let n=i+1,o=save.stages.includes(n),b=document.createElement('button');b.className='card'+(o?'':' lock');b.innerHTML=`<span class=tag>${o?'OPEN':'🔒 LOCK'}</span><div class=icon>${a[2]}</div><strong>STAGE ${n}<br>${a[0]}</strong><small>${o?a[1]:'前のステージをクリアすると解放'}</small>`;b.onclick=()=>{if(o){stage=n;renderForms();show('forms')}};z.append(b)})}
function renderForms(){let z=$('#formCards');z.innerHTML='';FM.forEach(a=>{let o=save.forms.includes(a[0]),b=document.createElement('button');b.className='card'+(o?'':' lock')+(o&&form===a[0]?' sel':'');b.innerHTML=`<span class=tag>${o?'SELECT':'🔒 LOCK'}</span><div class=icon>${a[3]}</div><strong>${a[1]}</strong><small>${o?a[2]:'ゲームを進めると解放'}</small>`;b.onclick=()=>{if(o){form=a[0];renderForms()}};z.append(b)})}
$('#titleStart').onclick=()=>{renderStages();show('stages')};$('#play').onclick=startGame;

const c=$('#c'),ctx=c.getContext('2d');let W=0,H=0,D=1,G=0,CAM=0,WORLD=3300,last=0,raf=0,running=false;let player,enemies=[],items=[],boss=null,eventDone=false,goal=3150,shots=[];const key={l:0,r:0,j:0,p:0,k:0,s:0};
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);G=H-108}addEventListener('resize',resize);resize();
$$('.ctl').forEach(b=>{let k=b.dataset.k,d=e=>{e.preventDefault();key[k]=1;b.classList.add('on')},u=e=>{e.preventDefault();key[k]=0;b.classList.remove('on')};b.onpointerdown=d;b.onpointerup=u;b.onpointercancel=u;b.onpointerleave=u});
const km={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'j',' ':'j',z:'p',Z:'p',x:'k',X:'k',c:'s',C:'s'};
addEventListener('keydown',e=>{if(km[e.key]){e.preventDefault();key[km[e.key]]=1}});addEventListener('keyup',e=>{if(km[e.key]){e.preventDefault();key[km[e.key]]=0}});
function foe(px,type='bug'){let B=type!=='bug';return{x:px,y:G-(B?78:46),w:B?62:38,h:B?78:46,type,hp:B?(type==='chronos'?300:190):44,max:B?(type==='chronos'?300:190):44,dead:0,hit:0,cd:0}}
function startGame(){show('game');resize();CAM=0;eventDone=false;shots=[];player={x:70,y:G-66,w:48,h:66,vx:0,vy:0,hp:100,face:1,atk:0,cd:0,inv:0,muscle:0,jump:0,speed:0};enemies=[];items=[];boss=null;
if(stage===1){[470,820,1190,1620,1970].forEach(v=>enemies.push(foe(v)));items=[{x:650,t:'muscle',got:0},{x:1320,t:'jump',got:0},{x:1830,t:'speed',got:0}];boss=foe(2530,'salty');enemies.push(boss)}
if(stage===2){[480,840,1190,1980,2310].forEach(v=>enemies.push(foe(v)));items=[{x:690,t:'muscle',got:0},{x:2150,t:'speed',got:0}]}
if(stage===3){[500,900,1320,1680].forEach(v=>enemies.push(foe(v)));items=[{x:1050,t:'jump',got:0},{x:1510,t:'muscle',got:0},{x:1950,t:'speed',got:0}];boss=foe(2550,'chronos');enemies.push(boss)}
$('#stageHud').textContent='STAGE '+stage;$('#formHud').textContent=form==='Mighty'?'MIGHTY':form==='BrothersXX'?'BROTHERS XX':'HYPER MUTEKI';$('#overlay').classList.remove('on');running=true;last=performance.now();toast('GAME START!');cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function toast(m,t=1100){let a=$('#toast');a.innerHTML=m;a.classList.add('on');clearTimeout(a.t);a.t=setTimeout(()=>a.classList.remove('on'),t)}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function power(){return (form==='HyperMuteki'?30:form==='BrothersXX'?20:14)*(player.muscle>0?1.75:1)}
function update(dt){let p=player;p.muscle=Math.max(0,p.muscle-dt);p.jump=Math.max(0,p.jump-dt);p.speed=Math.max(0,p.speed-dt);p.inv=Math.max(0,p.inv-dt);p.cd=Math.max(0,p.cd-dt);p.atk=Math.max(0,p.atk-dt);
let spd=(p.speed>0?340:270)*(form==='HyperMuteki'?1.1:1);p.vx=(key.r-key.l)*spd;if(p.vx)p.face=Math.sign(p.vx);if(key.j&&p.y>=G-p.h-2){p.vy=p.jump>0?-700:-535;key.j=0}p.vy+=1250*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>G-p.h){p.y=G-p.h;p.vy=0}p.x=Math.max(0,Math.min(WORLD-p.w,p.x));
if((key.p||key.k||key.s)&&p.cd<=0){let special=key.s;p.atk=special?.45:.23;p.cd=special?1.15:(form==='BrothersXX'?.20:.28);key.p=key.k=key.s=0;toast(special?'MIGHTY CRITICAL STRIKE!':'ATTACK!',special?650:260);let ar={x:p.face>0?p.x+p.w:p.x-88,y:p.y+3,w:88,h:p.h};enemies.forEach(e=>{if(!e.dead&&hit(ar,e)){e.hp-=power()*(special?3:1);e.hit=.14;if(e.hp<=0)e.dead=1}})}
items.forEach(i=>{if(!i.got&&Math.abs(p.x-i.x)<45){i.got=1;if(i.t==='muscle'){p.muscle=9;toast('💪 MUSCLE! ATTACK UP',1500)}if(i.t==='jump'){p.jump=9;toast('⬆️ JUMP UP!',1500)}if(i.t==='speed'){p.speed=9;toast('⚡ SPEED UP!',1500)}}});
enemies.forEach(e=>{if(e.dead)return;e.hit=Math.max(0,e.hit-dt);e.cd=Math.max(0,e.cd-dt);let d=p.x-e.x;if(Math.abs(d)<430)e.x+=Math.sign(d)*(e.type==='bug'?55:72)*dt;
if(e.type==='chronos'&&Math.abs(d)<600&&e.cd<=0){e.cd=2.2;shots.push({x:e.x,y:e.y+30,vx:Math.sign(d)*-260,w:18,h:10,life:3});toast('CHRONOS SPECIAL!',450)}
if(hit(p,e)&&p.inv<=0){if(p.vy>130&&p.y+p.h<e.y+25){e.hp-=26;p.vy=-335;if(e.hp<=0)e.dead=1}else{let dmg=e.type==='bug'?9:17;if(form==='HyperMuteki')dmg=Math.ceil(dmg*.35);p.hp-=dmg;p.inv=.8;toast(e.type==='salty'?'BOSS ATTACK!':e.type==='chronos'?'CHRONOS ATTACK!':'DAMAGE!',450)}}});
shots.forEach(s=>{s.x+=s.vx*dt;s.life-=dt;if(s.life>0&&p.inv<=0&&hit(p,s)){p.hp-=form==='HyperMuteki'?6:18;p.inv=.8;s.life=0}});
shots=shots.filter(s=>s.life>0);
if(stage===2&&!eventDone&&p.x>1480){eventDone=true;running=false;dialog('<h2>PARADOX 登場！</h2><p>パラドクスから新しい力を獲得した！</p><h2 style="color:#b8ff38">MIGHTY BROTHERS XX GET!</h2>',()=>{if(!save.forms.includes('BrothersXX'))save.forms.push('BrothersXX');persist();running=true;last=performance.now();raf=requestAnimationFrame(loop)})}
if(p.hp<=0){running=false;dialog('<h2>GAME OVER</h2><p>もう一度挑戦しよう！</p>',startGame,'RETRY')}
if(p.x>goal&&(!boss||boss.dead))clearStage();CAM=Math.max(0,Math.min(WORLD-W,p.x-W*.34));$('#hp').style.width=Math.max(0,p.hp)+'%'}
function clearStage(){if(!running)return;running=false;if(stage<3&&!save.stages.includes(stage+1))save.stages.push(stage+1);let m='';if(stage===2&&!save.forms.includes('BrothersXX')){save.forms.push('BrothersXX');m='<p>MIGHTY BROTHERS XX 解放！</p>'}if(stage===3&&!save.forms.includes('HyperMuteki')){save.forms.push('HyperMuteki');m='<p>⭐ HYPER MUTEKI 解放！</p>'}persist();dialog('<h2>STAGE CLEAR!</h2>'+m,()=>{renderStages();show('stages')})}
function dialog(h,fn,l='OK'){let o=$('#overlay');o.innerHTML=`<div class=dlg>${h}<button id=ok>${l}</button></div>`;o.classList.add('on');$('#ok').onclick=()=>{o.classList.remove('on');fn()}}
$('#menuBtn').onclick=()=>{running=false;dialog('<h2>PAUSE</h2><p>ステージセレクトへ戻ります。</p>',()=>{renderStages();show('stages')},'戻る')};

function drawMighty(p){let a=p.x-CAM,b=p.y;ctx.save();if(p.inv&&Math.floor(p.inv*12)%2)ctx.globalAlpha=.35;let flip=p.face<0;ctx.translate(a+(flip?p.w:0),b);if(flip)ctx.scale(-1,1);
ctx.fillStyle='#d92e86';ctx.strokeStyle='#57213f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(28,8);ctx.lineTo(50,-5);ctx.lineTo(44,11);ctx.lineTo(61,4);ctx.lineTo(50,20);ctx.lineTo(63,21);ctx.lineTo(46,30);ctx.lineTo(30,30);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#ed4b9b';ctx.beginPath();ctx.moveTo(5,7);ctx.quadraticCurveTo(22,-5,40,5);ctx.quadraticCurveTo(50,15,45,31);ctx.quadraticCurveTo(39,43,22,44);ctx.quadraticCurveTo(5,42,1,28);ctx.quadraticCurveTo(-2,15,5,7);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#edf1f2';ctx.beginPath();ctx.moveTo(8,12);ctx.quadraticCurveTo(23,4,37,11);ctx.lineTo(43,23);ctx.lineTo(35,35);ctx.lineTo(12,35);ctx.lineTo(4,24);ctx.closePath();ctx.fill();
ctx.fillStyle='#151522';ctx.beginPath();ctx.moveTo(10,13);ctx.quadraticCurveTo(23,8,35,13);ctx.lineTo(39,23);ctx.lineTo(32,31);ctx.lineTo(13,31);ctx.lineTo(7,23);ctx.closePath();ctx.fill();
ctx.fillStyle='#ffad28';ctx.beginPath();ctx.moveTo(10,18);ctx.lineTo(21,20);ctx.lineTo(17,25);ctx.lineTo(11,23);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(35,18);ctx.lineTo(24,20);ctx.lineTo(28,25);ctx.lineTo(34,23);ctx.closePath();ctx.fill();
ctx.fillStyle='#aee936';ctx.strokeStyle='#49213d';ctx.beginPath();ctx.moveTo(13,41);ctx.lineTo(32,41);ctx.lineTo(38,55);ctx.lineTo(30,65);ctx.lineTo(14,64);ctx.lineTo(8,53);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#ed4b9b';ctx.beginPath();ctx.ellipse(40,49,9,12,-.55,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(8,51,8,11,.5,0,Math.PI*2);ctx.fill();ctx.stroke();
ctx.fillStyle='#75bd32';ctx.beginPath();ctx.moveTo(16,61);ctx.lineTo(26,62);ctx.lineTo(20,75);ctx.lineTo(9,76);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(28,60);ctx.lineTo(36,63);ctx.lineTo(43,72);ctx.lineTo(36,78);ctx.lineTo(26,67);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle='#ed4b9b';ctx.beginPath();ctx.moveTo(8,72);ctx.lineTo(21,71);ctx.lineTo(20,80);ctx.lineTo(4,81);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(37,71);ctx.lineTo(45,69);ctx.lineTo(51,76);ctx.lineTo(40,81);ctx.closePath();ctx.fill();ctx.stroke();
if(form==='BrothersXX'){ctx.strokeStyle='#35e7ff';ctx.lineWidth=3;ctx.strokeRect(-5,-7,69,90)}if(form==='HyperMuteki'){ctx.strokeStyle='#ffe65a';ctx.lineWidth=5;ctx.beginPath();ctx.arc(25,38,43,0,Math.PI*2);ctx.stroke()}if(p.muscle>0){ctx.strokeStyle='#ff914d';ctx.lineWidth=3;ctx.strokeRect(-5,-7,69,90)}if(p.atk){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(49,45,23,-1.25,1.15);ctx.stroke()}ctx.restore()}
function drawEnemy(e){if(e.dead)return;let a=e.x-CAM,b=e.y;if(e.type==='bug'){ctx.fillStyle=e.hit?'#fff':'#7145b2';ctx.fillRect(a+4,b+9,30,32);ctx.fillStyle='#b8ff38';ctx.fillRect(a+8,b,21,17);ctx.fillStyle='#111';ctx.fillRect(a+11,b+5,5,5);ctx.fillRect(a+22,b+5,5,5)}else{let salty=e.type==='salty';ctx.fillStyle=e.hit?'#fff':salty?'#d6d8dc':'#16845f';ctx.fillRect(a+8,b+18,44,52);ctx.fillStyle=salty?'#70528d':'#20222d';ctx.fillRect(a+12,b,36,29);ctx.fillStyle=salty?'#ff3fa4':'#b8ff38';ctx.fillRect(a+17,b+7,8,8);ctx.fillRect(a+33,b+7,8,8);ctx.fillStyle='#111';ctx.fillRect(a,b-14,62,7);ctx.fillStyle='#ff3e79';ctx.fillRect(a,b-14,62*Math.max(0,e.hp/e.max),7)}}
function drawItem(i){if(i.got)return;let a=i.x-CAM,b=G-66,col=i.t==='muscle'?'#ff914d':i.t==='jump'?'#35e7ff':'#ffe65a';ctx.fillStyle=col;ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.beginPath();ctx.arc(a,b,20,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(i.t==='muscle'?'M':i.t==='jump'?'↑':'S',a,b+6)}

function drawBackground(){let g=ctx.createLinearGradient(0,0,0,H);if(stage===1){g.addColorStop(0,'#ffbd38');g.addColorStop(.5,'#e86137');g.addColorStop(1,'#39203c')}else if(stage===2){g.addColorStop(0,'#3942a1');g.addColorStop(1,'#15152c')}else{g.addColorStop(0,'#18382e');g.addColorStop(1,'#10151c')}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
if(stage===1){for(let i=0;i<18;i++){let a=i*190-(CAM*.16%190),h=70+(i%4)*28;ctx.fillStyle=i%2?'#211923':'#15151c';ctx.fillRect(a,G-h-45,108,h)}for(let i=0;i<9;i++){let a=i*380+70-(CAM*.24%380);ctx.fillStyle='#11131a';ctx.fillRect(a,G-235,20,190);ctx.fillRect(a-5,G-242,30,10)}ctx.fillStyle='#101218';ctx.fillRect(0,G-72,W,10);ctx.fillRect(0,G-45,W,7)}else{for(let i=0;i<14;i++){let a=i*230-(CAM*.22%230);ctx.fillStyle=i%2?'#ffffff0b':'#35e7ff0b';ctx.fillRect(a,70+(i%3)*38,95,130)}}
ctx.fillStyle=stage===1?'#242329':'#282e43';ctx.fillRect(0,G,W,H-G);ctx.strokeStyle='#b8ff3838';ctx.lineWidth=2;for(let a=-CAM%75;a<W;a+=75){ctx.beginPath();ctx.moveTo(a,G);ctx.lineTo(a+40,H);ctx.stroke()}}
